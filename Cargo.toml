[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.16.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/finmoor/kuai"

[workspace.dependencies]
fr-core = { path = "crates/fr-core" }
fr-channel = { path = "crates/fr-channel" }
fr-mount = { path = "crates/fr-mount" }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = { version = "0.9", features = ["tree-sitter", "tree-sitter-languages"] }
# 只为打开 GPUI 的 profiler 特性（帧耗时统计和浮层，M0 测性能用），版本必须和 gpui-kit 依赖的一致。
# 不用 gpui-kit 自己的 profiler 特性：它会把可选的 gpui-fast 也拉进版本解析，taffy 版本冲突。
gpui-pre = { version = "=0.3.12", features = ["profiler"] }

# 开发构建：依赖全开优化，界面滚动才看得出真实性能；自己的代码只开 1 级，增量编译快
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
