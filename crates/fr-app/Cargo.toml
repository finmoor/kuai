[package]
name = "fr-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
# 把图标和版本信息嵌进 exe（用 Windows SDK 里的 rc.exe）
winresource = "0.1"

[dependencies]
fr-core.workspace = true
fr-channel.workspace = true
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui-kit.workspace = true
gpui-pre.workspace = true
chrono = "0.4"
log = "0.4"
# 非 UTF-8 的文件（GBK 等）解码后显示
encoding_rs = "0.8"
# 行内差异：按词比较配对的两行（组件库也用它，不多带一个库）
similar = "2"
# 拿窗口句柄，让系统标题栏跟着深色主题（appearance.rs）
raw-window-handle = "0.6"
# 内置终端：伪终端（Windows 上是 ConPTY）和终端仿真，画由 terminal/ 自己来
alacritty_terminal = "0.26"
# 往终端里发剪贴板里的图片：位图转成 PNG（GPUI 也用它，不多带一个库）
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "ico", "pnm"] }
# 检查更新、点一下升级（update.rs）：问 GitHub Releases、下载发布包（ureq，rustls），
# 核对 SHA-256，解压 zip，换掉正在运行的 kuai.exe（Windows 上只能改名、不能删，self-replace 处理）
ureq = { version = "3.5.2", features = ["json"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
self-replace = "1.5.1"
semver = "1.0.28"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# 托盘图标和它的右键菜单（最小化到托盘、关闭到托盘）
tray-icon = { version = "0.26", default-features = false }
# 开机自启：写 HKCU 的 Run 键
winreg = "0.56"
