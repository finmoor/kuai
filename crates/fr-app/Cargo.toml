[package]
name = "fr-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
# 把图标和版本信息嵌进 exe（用 Windows SDK 里的 rc.exe）
winresource = "0.1"

[dependencies]
fr-core.workspace = true
fr-channel.workspace = true
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui-kit.workspace = true
gpui-pre.workspace = true
chrono = "0.4"
log = "0.4"
# 非 UTF-8 的文件（GBK 等）解码后显示
encoding_rs = "0.8"
# 行内差异：按词比较配对的两行（组件库也用它，不多带一个库）
similar = "2"
# 拿窗口句柄，让系统标题栏跟着深色主题（appearance.rs）
raw-window-handle = "0.6"
# 内置终端：伪终端（Windows 上是 ConPTY）和终端仿真，画由 terminal/ 自己来
alacritty_terminal = "0.26"

[target.'cfg(windows)'.dependencies]
# 托盘图标和它的右键菜单（最小化到托盘、关闭到托盘）
tray-icon = { version = "0.26", default-features = false }
# 开机自启：写 HKCU 的 Run 键
winreg = "0.56"
