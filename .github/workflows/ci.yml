# 推到 main、提 PR 时跑测试：Windows、Linux 各跑一遍整个工作区的测试。
# kuaid 常驻那一套（拉起、终端断开后还在、升级不断终端）两个系统各有一份实现、各测各的：
# Windows 版（crates/kuaid/tests/windows.rs）在 windows 任务里，Linux 版（tests/linux.rs）在 linux 任务里。
# Linux 任务和发版时一样在 ubuntu-22.04 上（发布的 Linux 版客户端要 glibc 2.35 及以上）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        run: cargo test --workspace

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 和 release.yml 的 linux 任务一样
      - name: 装 GPUI 要的开发包
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev
      - name: 测试（含 kuaid 的 tests/linux.rs）
        run: cargo test --workspace
