# 推到 main、提 PR 时跑测试。
# kuaid 常驻那一套（拉起、终端断开后还在、升级不断终端）两个系统各有一份实现、各测各的：
# Windows 版（crates/kuaid/tests/windows.rs）跟着 windows 任务的全部测试一起跑，
# Linux 版（tests/linux.rs）单独一个 ubuntu 的任务。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        run: cargo test --workspace

  kuaid-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: kuaid 的测试（含 tests/linux.rs）
        run: cargo test -p kuaid
