# 推 v1.8.0 这样的标签就发版：测试、打包，把 Windows 的安装程序 kuai-<版本>-windows-x64-setup.exe、
# 解压版 kuai-<版本>-windows-x64.zip 和 Linux 版（kuai_<版本>_amd64.deb、kuai-<版本>-linux-x64.AppImage、
# 解压版 kuai-<版本>-linux-x64.tar.gz）传到 GitHub Releases。
# 先编 Windows 版，Linux 版拿它打好的 kuaid 文件夹（两个平台的包里带一模一样的 kuaid，见
# tools/package-linux.sh），两边都打好了才建 Release，不会出现只有一半附件的版本。
# 发布说明取自 CHANGELOG.md 里这个版本的那一节。GitHub 会给附件算 SHA-256（API 的 assets[].digest），
# Kuai 升级时拿它核对下载的文件，所以不另传校验文件。
name: Release

on:
  push:
    tags: ['v*']

# 默认只读：测试、打包的两个任务跑第三方的工具和脚本，用不着改仓库、建 Release；只有 publish 要写
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - name: 标签和 Cargo.toml 的版本号要一致
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Cargo.toml 是 $version，标签是 $env:TAG" }

      - name: 测试
        run: cargo test --workspace

      # 编安装程序用。直接下官方 GitHub 上的安装包，和本机用的同一版，核对 SHA-256
      # （和 winget 清单 JRSoftware.InnoSetup 6.7.3 里记的一样）
      - name: 装 Inno Setup 6.7.3
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest $url -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw "Inno Setup 安装包的 SHA-256 不对：$hash"
          }
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER' -Wait
          $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "没装上：$iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: 打包
        shell: pwsh
        run: |
          ./tools/package.ps1
          # Linux 版的包要同一批 kuaid：拷到固定的位置再交出去
          $version = $env:TAG.TrimStart('v')
          Copy-Item -Recurse "dist\kuai-$version-windows-x64\Kuai\kuaid" kuaid-for-linux

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/kuai-*-windows-x64-setup.exe
            dist/kuai-*-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: kuaid
          path: kuaid-for-linux/
          if-no-files-found: error

  # 在 22.04 上编：在哪个系统上编，就要那个版本及以上的 glibc（22.04 是 2.35）
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 装 GPUI 要的开发包
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev

      - name: 测试
        run: cargo test --workspace

      - uses: actions/download-artifact@v4
        with:
          name: kuaid
          path: kuaid-from-windows

      # AppImage 的打包程序和运行时：固定版本，核对校验值（GitHub 给附件记的 SHA-256）。换运行时的
      # 版本时照 vendor/appimage-runtime/README.md 换许可证
      - name: 下 AppImage 的打包工具
        run: |
          mkdir -p appimage-tools && cd appimage-tools
          curl -fsSL --retry 3 -o appimagetool-x86_64.AppImage             https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 3 -o runtime-x86_64             https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<'EOF'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          EOF
          chmod +x appimagetool-x86_64.AppImage

      - name: 打包
        run: |
          ./tools/package-linux.sh --kuaid kuaid-from-windows --deb             --appimage appimage-tools/appimagetool-x86_64.AppImage appimage-tools/runtime-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/kuai-*-linux-x64.tar.gz
            dist/kuai_*_amd64.deb
            dist/kuai-*-linux-x64.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    # 建 Release、传附件
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - name: 发布说明
        shell: pwsh
        run: |
          # 只放 CHANGELOG 里的条目；装哪个包、怎么装见 README
          ./tools/release-notes.ps1 $env:TAG.TrimStart('v') | Set-Content -Encoding utf8NoBOM notes.md

      - name: 传到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = 'kuai-*-windows-x64-setup.exe', 'kuai-*-windows-x64.zip', 'kuai-*-linux-x64.tar.gz',
            'kuai_*_amd64.deb', 'kuai-*-linux-x64.AppImage' | ForEach-Object {
            $file = Get-ChildItem dist -Filter $_ | Select-Object -First 1
            if (-not $file) { throw "缺 $_" }
            $file.FullName
          }
          gh release create $env:TAG @files --title "Kuai $env:TAG" --notes-file notes.md --verify-tag
